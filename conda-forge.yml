github:
  user_or_org: cryoem
  repo_name: eman-feedstock

channel_priority: flexible

provider:
  linux: github_actions
  linux-aarch64: github_actions
  osx: github_actions
  win: github_actions

# Enables the manual "Run workflow" button in the GitHub Actions UI natively via conda-smithy
github_actions:
  trigger_via_workflow_dispatch: true

os_version:
  linux_64: cos7

build_platform:
  osx_arm64: osx_64
test_on_native_only: true
