channel_sources:
  - conda-forge, cryoem
channel_targets:
- cryoem main

ui:
  - gui
  - nogui

pyopengl:
  - 3.1.10
nodejs:
  - '*'
numpy:
  - 2

c_stdlib:
  - sysroot                  # [linux]
  - macosx_deployment_target # [osx]

c_stdlib_version:
  - 2.17                     # [linux]
  - 11.0                     # [osx and arm64]
  - 10.13                    # [osx and x86_64]

MACOSX_DEPLOYMENT_TARGET:
  - 11.0                     # [osx and arm64]
  - 10.13                    # [osx and x86_64]

pin_run_as_build:
  pyopengl:
    max_pin: x.x


ignore_version:
  - nodejs
